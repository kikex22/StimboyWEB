<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="CreateU.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <header>
    <h1>Crear Cuenta</h1>
  </header>
  <body>
    <div id="app" class="main">
        <form @submit.prevent="createAccount">
            <label for="birthdate">Fecha de nacimiento:</label>
            <input type="date" v-model="birthdate" id="birthdate" name="birthdate" required>
            <label for="country">Pais:</label>
            <select id="country" select v-if="paises.length" v-model="country" name="country" required>
                <option v-for="pais in paises" :key="pais.cca3" :value="pais.name.common">
                 {{ pais.name.common }}   
                </option>
            </select>
            <p v-else>Cargando...</p>
            <label for="name">Nombre:</label>
            <input type="text" v-model="name" id="name" name="name" required>
            <label for="email">Correo:</label>
            <input type="email" id="email" v-model="email" name="email" required>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" v-model="password" name="password" required>
            <button type="submit" id="submitSignUp">Crear cuenta</button>
            <div id="signUpMessage" style="display: none; color: red; font-size: 14px; margin-top: 10px;"></div>
        </form>
        <p> Ya tienes cuenta? <a href="Login.html"> inicia sesion aqui</a></p>
        <p class="social-log">Inicia sesion con:</p>
        <div class="social-buttons">
            <button id="googleSignIn" class="social-btn" @click="GoogleSignIn">
            <img src="google.png" alt="google"/>
            </button>
            <button id="facebookSignIn" class="fb-btn " @click="facebookSignIn">
            <img src="facebook.png" alt="facebook"/>
            </button>
            <button id="microsoftSignIn" class="m-btn" @click="microsoftSignIn">
            <img src="microsoft.png" alt="microsoft"/>
            </button>
        </div>
    </div>
    <footer>
     <p class="footerp">&copy; 2024 StimBoy. Todos los derechos reservados.</p>
    </footer>
    <script type="module" src="CreateA.js"></script>




  </body>
</html>
